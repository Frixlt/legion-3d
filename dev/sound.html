<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Legion 3D · звук</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { margin: 0; padding: 18px 22px; background: #14112a; color: #f3ecff; font: 14px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 22px; } h2 { font-size: 15px; margin: 18px 0 8px; color: #ffe9a8; }
  .sub { color: #b7aed6; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px; }
  .cell { display: flex; gap: 6px; align-items: center; background: #1f1a3d; border-radius: 8px; padding: 6px 8px; }
  .cell b { flex: 1; font: 12px ui-monospace, monospace; }
  button { background: #3a2f6b; color: #fff; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #4b3d8a; }
  label { display: flex; gap: 6px; align-items: center; }
  pre { background: #0d0b22; padding: 10px; border-radius: 8px; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script src="sound.js"></script>
</body>
</html>
