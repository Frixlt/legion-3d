<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Legion 3D · rooms</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #14112a; overflow: hidden; color: #f3ecff; font: 14px/1.35 'Nunito', 'Trebuchet MS', sans-serif; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; left: 10px; top: 8px; white-space: pre; background: rgba(20, 16, 42, .55); padding: 6px 9px;
         border-radius: 8px; pointer-events: none; font: 11px/1.35 ui-monospace, monospace; display: none; }
  body.stats #hud { display: block; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #0008; pointer-events: none; }
  #prompt { position: fixed; left: 50%; top: calc(50% + 28px); transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgba(29,22,32,.82);
            box-shadow: 0 0 0 1.5px #ffcf6a55; font-weight: 800; font-size: 13px; pointer-events: none; transition: opacity .15s; white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-60px); padding: 10px 18px; border-radius: 14px; background: rgba(29,22,32,.92);
           box-shadow: 0 0 0 1.5px #8fe39a; font-weight: 800; transition: transform .25s; pointer-events: none; }
  #toast.on { transform: translateX(-50%) translateY(0); } #toast.bad { box-shadow: 0 0 0 1.5px #ff8f8f; color: #ffc0b8; }
  body[data-panel]::after { content: 'панель сайта (' attr(data-panel) ')'; position: fixed; top: 70px; bottom: 70px; width: min(420px, 36vw); background: rgba(40,30,50,.82);
           border-radius: 18px; box-shadow: 0 0 0 1.5px #ffcf6a55; display: grid; place-items: center; color: #bfaab7; font-weight: 800; pointer-events: none; }
  body[data-panel="left"]::after { left: 24px; } body[data-panel="right"]::after { right: 24px; } body[data-panel="full"]::after { left: 24px; right: 24px; width: auto; }
  body.nopanel::after { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="cross"></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="hud"></div>
<script>if (/stats=1/.test(location.search)) document.body.classList.add('stats'); if (/nopanel=1/.test(location.search)) document.body.classList.add('nopanel');</script>
<script src="rooms.js"></script>
</body>
</html>
