name: Ошибка Legion 3D
description: Сообщить о воспроизводимой ошибке расширения
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Не прикладывайте имена игроков, переписку, cookie, токены или скриншоты с личными данными.'
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести?
      description: Укажите шаги и ожидаемое поведение.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия расширения
  - type: input
    id: renderer
    attributes:
      label: GPU renderer
  - type: input
    id: fps
    attributes:
      label: FPS
  - type: input
    id: quality
    attributes:
      label: Качество
